<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="prompt-regression-gate: a PR gate for Prompt Builder template changes that reports the noise floor of the review sample and the claims no merged-in field supports">
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 34px; font-weight: 700; fill: #ffffff; letter-spacing: -0.5px; }
    .claim { font-size: 17px; fill: #c7d0e0; }
    .axis { stroke: #5a6b85; stroke-width: 1; }
    .tick { font-size: 11px; fill: #8793a8; }
    .label { font-size: 12px; fill: #9fc1ff; font-weight: 600; }
    .floor { stroke: #9fc1ff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 1.8s ease-in-out 0.6s forwards; }
    .effect { stroke: #ffe08a; stroke-width: 2; stroke-dasharray: 8 6; opacity: 0; animation: fade 0.8s ease-out 2.4s forwards; }
    .mark { opacity: 0; animation: fade 0.6s ease-out forwards; }
    .m1 { animation-delay: 2.8s; } .m2 { animation-delay: 3.2s; } .m3 { animation-delay: 3.6s; }
    .figure { font-size: 15px; fill: #ffffff; font-weight: 600; }
    .figure.warn { fill: #ffe08a; }
    .figure.ok { fill: #b7e4bc; }
    .figure.bad { fill: #ff9f9f; }
    .caption { font-size: 12px; fill: #8793a8; }
    .fig { opacity: 0; animation: fade 0.8s ease-out forwards; }
    .f1 { animation-delay: 3.0s; } .f2 { animation-delay: 3.3s; } .f3 { animation-delay: 3.6s; } .f4 { animation-delay: 4.2s; }
    .claimline { font-size: 12px; fill: #c7d0e0; }
    .dot { opacity: 0; animation: fade 0.5s ease-out forwards; }
    .d1 { animation-delay: 4.0s; } .d2 { animation-delay: 4.3s; } .d3 { animation-delay: 4.6s; } .d4 { animation-delay: 4.9s; }
    .glow { animation: drift 12s ease-in-out infinite alternate; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(140px); } }
    @media (prefers-reduced-motion: reduce) {
      .floor { animation: none; stroke-dashoffset: 0; }
      .effect, .mark, .fig, .dot { animation: none; opacity: 1; }
      .glow { animation: none; }
    }
  </style>
  <rect width="1200" height="320" fill="#1b2a41"/>
  <ellipse class="glow" cx="900" cy="40" rx="420" ry="110" fill="#2b4a7a" opacity="0.35"/>
  <text x="40" y="58" class="title">prompt-regression-gate</text>
  <text x="40" y="88" class="claim">Thirty reviews cannot tell a better prompt from noise, and cannot see the claims the case does not support. This gate counts both.</text>

  <!-- the noise floor against n: the floor falls with the sample size, the observed effect is flat -->
  <line class="axis" x1="70" y1="290" x2="640" y2="290"/>
  <line class="axis" x1="70" y1="120" x2="70" y2="290"/>
  <text x="56" y="294" class="tick" text-anchor="end">0</text>
  <text x="56" y="214" class="tick" text-anchor="end">0.5</text>
  <text x="56" y="134" class="tick" text-anchor="end">1.0</text>
  <text x="640" y="308" class="tick" text-anchor="end">reviews</text>
  <text x="118" y="308" class="tick" text-anchor="middle">30</text>
  <text x="304" y="308" class="tick" text-anchor="middle">123</text>
  <text x="458" y="308" class="tick" text-anchor="middle">200</text>
  <path class="floor" d="M 82 150 C 100 178, 110 200, 118 212 S 180 246, 230 254 S 304 259, 304 259 S 400 268, 458 271 S 560 276, 630 278"/>
  <line class="effect" x1="70" y1="254" x2="640" y2="254"/>
  <g class="mark m1">
    <circle cx="118" cy="212" r="5" fill="#9fc1ff"/>
    <text x="128" y="206" class="label">floor 0.484 at thirty</text>
  </g>
  <g class="mark m2">
    <text x="520" y="248" class="label" fill="#ffe08a">ahead by 0.233</text>
  </g>
  <g class="mark m3">
    <circle cx="304" cy="259" r="5" fill="#ffe08a"/>
    <text x="314" y="246" class="label" fill="#ffe08a">123 reviews to know</text>
  </g>

  <!-- the second dimension: four claims and their verdicts -->
  <text x="700" y="140" class="caption">What the review score cannot see</text>
  <g class="dot d1"><circle cx="708" cy="162" r="5" fill="#b7e4bc"/><text x="722" y="166" class="claimline">The agent offered a refund of $240.00.</text></g>
  <g class="dot d2"><circle cx="708" cy="186" r="5" fill="#ff9f9f"/><text x="722" y="190" class="claimline">It is a Low priority case (the field says High).</text></g>
  <g class="dot d3"><circle cx="708" cy="210" r="5" fill="#ffb37a"/><text x="722" y="214" class="claimline">A replacement shipped under RMA-55001 (no such comment).</text></g>
  <g class="dot d4"><circle cx="708" cy="234" r="5" fill="#ffe08a"/><text x="722" y="238" class="claimline">Straps are replaced free within 12 months (another product's chunk).</text></g>
  <g class="fig f4"><text x="700" y="278" class="figure bad">84 bad claims unflagged</text><text x="700" y="298" class="caption">of 227 the grammar found across every generation; the preferred version carries the most</text></g>
</svg>
