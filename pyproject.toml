[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression-gate"
version = "0.1.0"
description = "Gates a Prompt Builder template change on two numbers the review score cannot give: the noise floor of the review sample and the claims no merged-in field supports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Chunduru", email = "hello.manojchunduru@gmail.com" }]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "coverage>=7", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
prg = "prg.cli:main"

[project.urls]
Repository = "https://github.com/ManojKumarChunduru/prompt-regression-gate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests", "experiments", "tools", "fixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/prg/report.py" = ["E501"]
"src/prg/policy.py" = ["E501"]
"src/prg/api.py" = ["E501"]
"fixture/generate.py" = ["E501"]
"tests/helpers.py" = ["E501"]
"tests/test_metadata.py" = ["E501"]
"experiments/*.py" = ["E501"]
"tools/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = "test_*"
addopts = "-q"

[tool.coverage.run]
source = ["prg"]
branch = false
omit = ["src/prg/adapters/openai_adapter.py", "src/prg/adapters/gemini_adapter.py"]

[tool.coverage.report]
show_missing = true
precision = 1
